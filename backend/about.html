<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Me</title>
    <style>
        body { 
            background: linear-gradient(135deg, #71b7e6, #d6c4de);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 380px;
            backdrop-filter: blur(10px);
        }
        .avatar {
            width: 100px;
            height: 100px;
            background: #007bff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        h1 { color: #333; margin-bottom: 25px; font-size: 24px; border-bottom: 2px solid #007bff; display: inline-block; padding-bottom: 5px; }
        .info-group { text-align: left; margin-bottom: 15px; }
        .label { font-weight: bold; color: #007bff; display: block; font-size: 14px; text-transform: uppercase; }
        .value { font-size: 18px; color: #444; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👨‍💻</div>
        <h1>THÔNG TIN SINH VIÊN</h1>
        <div class="info-group">
            <span class="label">Họ và Tên</span>
            <span class="value">NGÔ ANH TÚ</span>
        </div>
        <div class="info-group">
            <span class="label">Mã Số Sinh Viên</span>
            <span class="value">2251220045</span>
        </div>
        <div class="info-group">
            <span class="label">Lớp</span>
            <span class="value">22CT1</span>
        </div>
        <hr>
        <p style="font-size: 12px; color: #888;">© 2026 DevOps Mini Project - NoteApp</p>
    </div>
</body>
</html>
